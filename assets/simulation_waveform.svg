<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 2 4; }
      .time-label { fill: #64748b; font-family: monospace; font-size: 11px; text-anchor: middle; }
      .signal-name { fill: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; text-anchor: end; }
      .signal-type { fill: #94a3b8; font-family: monospace; font-size: 10px; text-anchor: end; }
      .wave-clk { stroke: #38bdf8; stroke-width: 1.8; fill: none; }
      .wave-binary { stroke: #a855f7; stroke-width: 2; fill: none; }
      .wave-done { stroke: #10b981; stroke-width: 2.2; fill: none; }
      .bus-outline { stroke: #f59e0b; stroke-width: 1.5; fill: #1e1b4b; fill-opacity: 0.6; }
      .bus-data { stroke: #06b6d4; stroke-width: 1.5; fill: #082f49; fill-opacity: 0.7; }
      .bus-acc { stroke: #10b981; stroke-width: 1.8; fill: #064e3b; fill-opacity: 0.8; }
      .bus-label { fill: #f8fafc; font-family: monospace; font-size: 10px; font-weight: bold; text-anchor: middle; }
      .title-text { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: bold; text-anchor: middle; }
      .phase-text { fill: #38bdf8; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; text-anchor: middle; }
      .cursor-line { stroke: #ef4444; stroke-width: 1.5; stroke-dasharray: 3 3; }
      .cursor-text { fill: #ef4444; font-family: monospace; font-size: 10px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1060" height="640" class="bg" rx="10"/>

  <!-- Title Header -->
  <text x="530" y="30" class="title-text">Vivado Behavioral Simulation Waveform (tb_sram_4bank: 4-Bank 64 KB SRAM)</text>

  <!-- Phase Markers -->
  <rect x="200" y="42" width="280" height="22" fill="#1e1b4b" rx="4" stroke="#a855f7" stroke-width="1"/>
  <text x="340" y="57" class="phase-text" fill="#c084fc">TEST 1: BANK-WISE WRITE &amp; READBACK</text>

  <rect x="520" y="42" width="510" height="22" fill="#064e3b" rx="4" stroke="#10b981" stroke-width="1"/>
  <text x="775" y="57" class="phase-text" fill="#34d399">TEST 2: ISOLATION CHECK (ADDR 10 ACROSS ALL 4 INDEPENDENT BANKS)</text>

  <!-- Time Grid Markers -->
  <g id="grid">
    <line x1="170" y1="70" x2="170" y2="610" class="grid-line"/>
    <text x="170" y="80" class="time-label">0 ns</text>

    <line x1="220" y1="70" x2="220" y2="610" class="grid-line"/>
    <text x="220" y="80" class="time-label">20 ns</text>

    <line x1="330" y1="70" x2="330" y2="610" class="grid-line"/>
    <text x="330" y="80" class="time-label">Write B0..3</text>

    <line x1="480" y1="70" x2="480" y2="610" class="grid-line"/>
    <text x="480" y="80" class="time-label">Read B0..3</text>

    <line x1="560" y1="70" x2="560" y2="610" class="grid-line"/>
    <text x="560" y="80" class="time-label">Write Addr 10</text>

    <line x1="680" y1="70" x2="680" y2="610" class="cursor-line"/>
    <text x="680" y="80" class="cursor-text" text-anchor="middle">Read B0 (0xCAFE)</text>

    <line x1="770" y1="70" x2="770" y2="610" class="cursor-line"/>
    <text x="770" y="80" class="cursor-text" text-anchor="middle">Read B1 (0xFEED)</text>

    <line x1="860" y1="70" x2="860" y2="610" class="cursor-line"/>
    <text x="860" y="80" class="cursor-text" text-anchor="middle">Read B2 (0xBEEF)</text>

    <line x1="950" y1="70" x2="950" y2="610" class="cursor-line"/>
    <text x="950" y="80" class="cursor-text" text-anchor="middle">Read B3 (0xDEAD)</text>
  </g>

  <!-- Signal 1: clk -->
  <text x="155" y="115" class="signal-name">clk</text>
  <text x="155" y="128" class="signal-type">100 MHz</text>
  <path d="M 170 120 L 190 120 L 190 100 L 210 100 L 210 120 L 230 120 L 230 100 L 250 100 L 250 120 L 290 120 L 290 100 L 330 100 L 330 120 L 370 120 L 370 100 L 410 100 L 410 120 L 450 120 L 450 100 L 490 100 L 490 120 L 530 120 L 530 100 L 570 100 L 570 120 L 610 120 L 610 100 L 650 100 L 650 120 L 690 120 L 690 100 L 730 100 L 730 120 L 770 120 L 770 100 L 810 100 L 810 120 L 850 120 L 850 100 L 890 100 L 890 120 L 930 120 L 930 100 L 970 100 L 970 120 L 1010 120 L 1010 100 L 1040 100" class="wave-clk"/>

  <!-- Signal 2: cs (Chip Select) -->
  <text x="155" y="165" class="signal-name">cs</text>
  <text x="155" y="178" class="signal-type">1-bit</text>
  <path d="M 170 170 L 220 170 L 220 150 L 510 150 L 510 170 L 540 170 L 540 150 L 1000 150 L 1000 170 L 1040 170" class="wave-binary" stroke="#38bdf8"/>

  <!-- Signal 3: write_en -->
  <text x="155" y="215" class="signal-name">write_en</text>
  <text x="155" y="228" class="signal-type">1-bit</text>
  <path d="M 170 220 L 220 220 L 220 200 L 350 200 L 350 220 L 540 220 L 540 200 L 630 200 L 630 220 L 1040 220" class="wave-binary" stroke="#c084fc"/>

  <!-- Signal 4: bank_sel[1:0] -->
  <text x="155" y="270" class="signal-name">bank_sel</text>
  <text x="155" y="283" class="signal-type">[1:0] dec</text>
  <polygon points="170,265 175,255 215,255 220,265 215,275 175,275" class="bus-outline"/>
  <text x="195" y="269" class="bus-label">0</text>
  <!-- Write phases -->
  <polygon points="220,265 225,255 250,255 255,265 250,275 225,275" class="bus-outline"/>
  <text x="238" y="269" class="bus-label">0</text>
  <polygon points="255,265 260,255 285,255 290,265 285,275 260,275" class="bus-outline"/>
  <text x="273" y="269" class="bus-label">1</text>
  <polygon points="290,265 295,255 320,255 325,265 320,275 295,275" class="bus-outline"/>
  <text x="308" y="269" class="bus-label">2</text>
  <polygon points="325,265 330,255 355,255 360,265 355,275 330,275" class="bus-outline"/>
  <text x="343" y="269" class="bus-label">3</text>
  <line x1="360" y1="265" x2="540" y2="265" stroke="#475569" stroke-width="2"/>
  <!-- Isolation writes (540 to 630) -->
  <polygon points="540,265 545,255 560,255 565,265 560,275 545,275" class="bus-outline"/>
  <text x="553" y="269" class="bus-label">0</text>
  <polygon points="565,265 570,255 585,255 590,265 585,275 570,275" class="bus-outline"/>
  <text x="578" y="269" class="bus-label">1</text>
  <polygon points="590,265 595,255 610,255 615,265 610,275 595,275" class="bus-outline"/>
  <text x="603" y="269" class="bus-label">2</text>
  <polygon points="615,265 620,255 635,255 640,265 635,275 620,275" class="bus-outline"/>
  <text x="628" y="269" class="bus-label">3</text>
  <!-- Isolation reads -->
  <polygon points="640,265 645,255 725,255 730,265 725,275 645,275" class="bus-outline"/>
  <text x="685" y="269" class="bus-label">Bank 0</text>
  <polygon points="730,265 735,255 815,255 820,265 815,275 735,275" class="bus-outline"/>
  <text x="775" y="269" class="bus-label">Bank 1</text>
  <polygon points="820,265 825,255 905,255 910,265 905,275 825,275" class="bus-outline"/>
  <text x="865" y="269" class="bus-label">Bank 2</text>
  <polygon points="910,265 915,255 995,255 1000,265 995,275 915,275" class="bus-outline"/>
  <text x="955" y="269" class="bus-label">Bank 3</text>

  <!-- Signal 5: addr[11:0] -->
  <text x="155" y="335" class="signal-name">addr</text>
  <text x="155" y="348" class="signal-type">[11:0] dec</text>
  <polygon points="170,330 175,320 220,320 225,330 220,340 175,340" class="bus-outline"/>
  <text x="198" y="334" class="bus-label">0</text>
  <polygon points="225,330 230,320 355,320 360,330 355,340 230,340" class="bus-outline"/>
  <text x="292" y="334" class="bus-label">100, 250, 500, 750</text>
  <polygon points="360,330 365,320 535,320 540,330 535,340 365,340" class="bus-outline"/>
  <text x="450" y="334" class="bus-label">100, 250, 500, 750 (Read)</text>
  <polygon points="540,330 545,320 995,320 1000,330 995,340 545,340" class="bus-outline" stroke="#38bdf8"/>
  <text x="770" y="334" class="bus-label">10 (Identical Address to all 4 banks)</text>

  <!-- Signal 6: write_data[31:0] -->
  <text x="155" y="405" class="signal-name">write_data</text>
  <text x="155" y="418" class="signal-type">[31:0] hex</text>
  <line x1="170" y1="400" x2="220" y2="400" stroke="#475569" stroke-width="2"/>
  <polygon points="220,400 225,390 355,390 360,400 355,410 225,410" class="bus-data"/>
  <text x="290" y="404" class="bus-label">0xB0_A1, 0xB1_D4...</text>
  <line x1="360" y1="400" x2="540" y2="400" stroke="#475569" stroke-width="2"/>
  <polygon points="540,400 543,390 562,390 565,400 562,410 543,410" class="bus-data"/>
  <text x="553" y="404" class="bus-label" font-size="8">CAFE</text>
  <polygon points="565,400 568,390 587,390 590,400 587,410 568,410" class="bus-data"/>
  <text x="578" y="404" class="bus-label" font-size="8">FEED</text>
  <polygon points="590,400 593,390 612,390 615,400 612,410 593,410" class="bus-data"/>
  <text x="603" y="404" class="bus-label" font-size="8">BEEF</text>
  <polygon points="615,400 618,390 637,390 640,400 637,410 618,410" class="bus-data"/>
  <text x="628" y="404" class="bus-label" font-size="8">DEAD</text>
  <line x1="640" y1="400" x2="1040" y2="400" stroke="#475569" stroke-width="2"/>

  <!-- Signal 7: read_data[31:0] -->
  <text x="155" y="485" class="signal-name">read_data</text>
  <text x="155" y="498" class="signal-type">[31:0] hex</text>
  <polygon points="170,480 175,470 655,470 660,480 655,490 175,490" class="bus-outline"/>
  <text x="415" y="484" class="bus-label">Initial Reads / Idle</text>
  <!-- Isolation read outcomes -->
  <polygon points="660,480 665,470 725,470 730,480 725,490 665,490" class="bus-acc" stroke="#10b981" stroke-width="2"/>
  <text x="695" y="484" class="bus-label">0xCAFE_0000</text>
  <polygon points="730,480 735,470 815,470 820,480 815,490 735,490" class="bus-acc" stroke="#10b981" stroke-width="2"/>
  <text x="775" y="484" class="bus-label">0xFEED_1111</text>
  <polygon points="820,480 825,470 905,470 910,480 905,490 825,490" class="bus-acc" stroke="#10b981" stroke-width="2"/>
  <text x="865" y="484" class="bus-label">0xBEEF_2222</text>
  <polygon points="910,480 915,470 995,470 1000,480 995,490 915,490" class="bus-acc" stroke="#10b981" stroke-width="2"/>
  <text x="955" y="484" class="bus-label">0xDEAD_3333</text>
  <line x1="1000" y1="480" x2="1040" y2="480" stroke="#475569" stroke-width="2"/>

  <!-- Annotation banner -->
  <rect x="230" y="540" width="760" height="40" fill="#064e3b" rx="6" stroke="#10b981" stroke-width="1.5"/>
  <text x="610" y="565" fill="#a7f3d0" font-family="system-ui" font-size="13px" font-weight="bold" text-anchor="middle">ZERO COLLISION / ZERO ALIASING: Address 10 holds distinct data across all 4 independent SRAM banks!</text>
</svg>

